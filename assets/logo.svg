  <rect x="8" y="8" width="104" height="104" rx="26" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="2"/>

  <!-- Anneaux d'agenda / réservation en haut -->
  <rect x="38" y="18" width="8" height="15" rx="4" fill="#FBBF24"/>
  <rect x="74" y="18" width="8" height="15" rx="4" fill="#FBBF24"/>

