    <path d="M26 35C26 29.4772 30.4772 25 36 25H84C89.5228 25 94 29.4772 94 35V75C94 84.9411 85.9411 93 76 93H36C30.4772 93 26 88.5228 26 83V35Z" fill="#FFFFFF"/>
